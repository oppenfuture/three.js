name: CD

on:
  push:
    branches: [r137-dev]

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to OSS
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: 'pnpm'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build

      - name: Install deployment packages
        run: pnpm install --no-frozen-lockfile
        working-directory: deployment

      - name: Deploy to OSS
        run: node index.js ${{ secrets.ALIYUN_SECRET_ID }} ${{ secrets.ALIYUN_SECRET_KEY }} oss-cn-beijing oppentech-test ../build/three.js /holodeck/js/cd/three-$(git rev-parse HEAD).js
        working-directory: deployment

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Modify version
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const base = pkg.version.split(/[+-]/)[0];
          pkg.version = `${base}-dev.sha${process.env.GITHUB_SHA}`;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log(`Development package version: ${pkg.version}`);
          NODE

      - name: Build
        run: pnpm run build

      - name: Modify npm repository
        run: |
          echo "@oppentech:registry=http://npm.internal.oppenlab.com/repository/npm_private/" >> ~/.npmrc
          echo "//npm.internal.oppenlab.com/repository/npm_private/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" >> ~/.npmrc

      - name: Publish to npm
        run: pnpm publish --tag dev --no-git-checks
